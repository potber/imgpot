name: production

on:
  push:
    tags:
    - v*

permissions:
  contents: read
  packages: write

jobs:
  release_image:
    permissions:
      contents: read
      packages: write
    uses: potber/.github/.github/workflows/release_image.yml@v2
    with:
      latest: true
      bunny_app_id: ${{ vars.BUNNY_APP_ID_PROD }}
    secrets:
      BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
